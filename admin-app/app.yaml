command:
  - "uvicorn"
  - "backend.main:app"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  # Lakebase instance the admin app reads/writes. The app's service principal
  # is granted a SERVICE_PRINCIPAL instance role; backend/db.py mints a
  # credential via that identity (PGHOST resolved from the instance).
  - name: LAKEBASE_INSTANCE
    value: "partner-board-db"
  - name: PGDATABASE
    value: "partner_board"
  # Public board URL included in the "new use case" email to partners.
  # Set once the Cloud Run portal is deployed; placeholder until then.
  - name: BOARD_URL
    value: "https://partner-board.example.com"
  - name: EMAIL_FROM
    value: "partner-board@example.com"
